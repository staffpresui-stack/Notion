<script>
'use strict';
const $=id=>document.getElementById(id), domains=['セールス・マーケ','EC','生産管理','経理・バックオフィス','Salesforce・AI','経営'];
let boot,current,offset=0,total=0,busy=false;
const parse=s=>{try{return JSON.parse(s||'[]')}catch(e){return []}};
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function message(text){$('message').textContent=text}
function rpc(name,arg){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg)})}
function disable(value){busy=value;document.querySelectorAll('button').forEach(b=>{b.disabled=value});if(!value)actions()}
function actions(){document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=!current||busy||(b.dataset.action==='retry'?current.status!=='要対応':current.status==='要対応'||current.status.startsWith('対象外'))});$('prev').disabled=busy||offset===0;$('next').disabled=busy||offset+50>=total}
function choices(select,values,value){select.replaceChildren();values.forEach(v=>{const o=node('option',v);o.value=v;select.append(o)});select.value=value||''}
function checkbox(parent,value,label,checked){const l=node('label'),i=node('input');i.type='checkbox';i.value=value;i.checked=checked;l.append(i,document.createTextNode(label));parent.append(l)}
function renderList(data){total=data.total;offset=data.offset;$('rows').replaceChildren();data.rows.forEach(r=>{const tr=node('tr');const date=node('td',new Date(r.event_start).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}));tr.append(date);const td=node('td'),b=node('button',r.display_id+' '+r.title);b.type='button';b.onclick=()=>loadDetail(r.meeting_key);td.append(b);tr.append(td);[r.source==='meet'?'Meet':'tl;dv',r.status,r.placement_final,parse(r.domains_final).join('／'),r.taskCount,r.confidence].forEach(v=>tr.append(node('td',v)));$('rows').append(tr)});$('count').textContent=total+'件中 '+(total?offset+1:0)+'〜'+Math.min(offset+50,total)+'件';actions()}
async function refresh(){const filters={status:$('status').value,date:$('date').value,domain:$('domain').value,mine:$('mine').checked,offset};renderList(await rpc('reviewList',filters))}
async function loadDetail(key){if(busy)return;disable(true);try{current=await rpc('reviewDetail',key);renderDetail();message('詳細を読み込みました。')}catch(e){current=null;$('detail').hidden=true;message(e.message)}finally{disable(false)}}
function renderDetail(){const r=current;$('detail').hidden=false;$('detailTitle').textContent=r.display_id+' 詳細・編集';$('facts').replaceChildren();[['会議キー',r.meeting_key],['日時',r.event_start+' 〜 '+r.event_end],['会議名',r.title],['主催者',r.organizer_email],['参加者',r.attendees.map(a=>a.email+'（'+(a.internal?'社内':'社外')+'）').join('／')],['状態',r.status],['根拠・確信度',r.reason+'／'+r.confidence],['ファイル状態',JSON.stringify(r.fileStatus||{})],['Notionの反映状態',r.notion_status],['エラー',r.last_error]].forEach(([k,v])=>$('facts').append(node('p',k+'：'+v)));$('links').replaceChildren();r.links.forEach(l=>{if(!/^https:\/\/(drive.google.com|www.notion.so)\//.test(l.url))return;const a=node('a',l.title);a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';$('links').append(a)});$('summary').textContent=JSON.stringify(r.summary,null,2)+'\nタスク提案：'+r.taskCount+'件';$('comparison').replaceChildren();[['区分',r.scope_auto,r.scope_final],['格納先',r.placement_auto,r.placement_final],['事業部領域',r.domains_auto,r.domains_final],['関連プロジェクト',r.related_project_ids_auto,r.related_project_ids_final]].forEach(([k,a,b])=>{const p=node('p',k+'：自動 '+a+' → 現在 '+b);if(a!==b)p.className='changed';$('comparison').append(p)});$('pending').textContent=r.pending?'処理記録：'+JSON.stringify(r.pending):'';$('scope').value=r.scope_final||'社内';choices($('placement'),boot.choices.folders,r.placement_final);$('placementSearch').value='';$('projectSearch').value='';$('domains').replaceChildren();domains.forEach(d=>checkbox($('domains'),d,d,parse(r.domains_final).includes(d)));$('projects').replaceChildren();const known=new Set();boot.choices.projects.forEach(p=>{known.add(p.id);checkbox($('projects'),p.id,p.title,parse(r.related_project_ids_final).includes(p.id))});parse(r.related_project_ids_final).filter(id=>!known.has(id)).forEach(id=>checkbox($('projects'),id,'現在の関連先（保存時に所属を確認） '+id,true));$('minutesTitle').value=r.minutes_title;$('newClient').hidden=!boot.admin;$('clientName').value='';$('clientDomains').value='';$('ackExternal').checked=false;$('history').textContent=r.history.map(h=>h.at+' '+h.actor+' '+h.action+' '+h.result+'\n変更前：'+h.before+'\n変更後：'+h.after).join('\n\n')||'変更履歴はありません。';actions()}
async function submit(action){if(busy||!current)return;if(action==='exclude'&&!window.confirm('この議事録を対象外にし、Notionをアーカイブします。よろしいですか？'))return;const key=current.meeting_key,request={meetingKey:key,version:current.version,nonce:boot.nonce,action};if(action==='edit_confirm')request.edits={scope:$('scope').value,placement:$('placement').value,domains:[...$('domains').querySelectorAll('input:checked')].map(i=>i.value),projectIds:[...$('projects').querySelectorAll('input:checked')].map(i=>i.value),minutesTitle:$('minutesTitle').value,newClient:{name:$('clientName').value,domains:$('clientDomains').value},ackExternal:$('ackExternal').checked};disable(true);try{const result=await rpc('reviewSubmit',request);message(result.message);boot=await rpc('reviewBootstrap');$('mode').textContent=boot.dryRun?'予定確認モード（DRY_RUN=true）':'テスト反映モード（DRY_RUN=false）';await refresh();current=await rpc('reviewDetail',key);renderDetail()}catch(e){message(e.message+' 必要に応じて一覧から開き直してください。')}finally{disable(false)}}
$('filters').onsubmit=async e=>{e.preventDefault();offset=0;disable(true);try{await refresh()}catch(e){message(e.message)}finally{disable(false)}};
$('prev').onclick=async()=>{offset=Math.max(0,offset-50);disable(true);try{await refresh()}catch(e){message(e.message)}finally{disable(false)}};$('next').onclick=async()=>{offset+=50;disable(true);try{await refresh()}catch(e){message(e.message)}finally{disable(false)}};
$('placementSearch').oninput=()=>{[...$('placement').options].forEach(o=>o.hidden=!o.textContent.includes($('placementSearch').value))};$('projectSearch').oninput=()=>{[...$('projects').children].forEach(l=>l.hidden=!l.textContent.includes($('projectSearch').value))};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>submit(b.dataset.action));
(async()=>{disable(true);try{boot=await rpc('reviewBootstrap');$('identity').textContent='利用者：'+boot.actor;$('mode').textContent=boot.dryRun?'予定確認モード（DRY_RUN=true）':'テスト反映モード（DRY_RUN=false）';domains.forEach(d=>{const o=node('option',d);o.value=d;$('domain').append(o)});renderList(boot.list);message('一覧から議事録を選んでください。')}catch(e){message(e.message)}finally{disable(false)}})();
</script>
