<!doctype html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f3f7f7;color:#183b39}button{font:inherit;padding:12px;margin:8px;background:#def0ec;border:1px solid #6e9992;border-radius:6px}li{margin:8px}#message{white-space:pre-wrap}button:disabled{opacity:.5}</style></head><body><h1>議事録の主催者登録</h1><p id="identity"></p><p id="mode"></p><p id="status"></p><p id="lastRun"></p><p>このGoogleアカウント本人が主催するMeetの添付を、指定したテスト予定だけで確認します。初回はfinance@専用です。</p><button id="register" disabled>この PC のアカウントで登録</button><button id="unregister" disabled>登録を解除</button><button id="preview" disabled>今すぐ確認する</button><p id="message" role="status" aria-live="polite">読み込み中です。</p><ul id="results"></ul>
<script>
let state,busy=false;const $=id=>document.getElementById(id);function disabled(v){busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v)}function rpc(name,arg){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg))}async function load(){state=await rpc('organizerBootstrap');$('identity').textContent='利用者：'+state.email;$('mode').textContent=state.dryRun?'予定確認モード（DRY_RUN=true）':'テスト移動モード（DRY_RUN=false）';$('status').textContent=(state.registered?'登録済み':'未登録')+'／定期実行：'+state.interval+'分／現在のトリガー：'+state.triggerCount+'個';$('lastRun').textContent='前回：'+(state.lastRun?new Date(state.lastRun).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+'（日本時間）':'未実行')+' '+state.lastResult}async function action(name){if(busy||!state)return;disabled(true);try{const result=await rpc(name,state.nonce);if(Array.isArray(result)){$('results').replaceChildren();result.forEach(r=>{const li=document.createElement('li');li.textContent=(r.meeting_key||r.eventId)+'：'+r.status+(r.missing&&r.missing.length?'／未到着：'+r.missing.map(k=>({recording:'録画',transcript:'文字起こし',gemini:'Geminiメモ'}[k]||k)).join('・'):'');$('results').append(li);(r.files||[]).forEach(f=>{const file=document.createElement('li');file.textContent=f.name+'／'+({recording:'録画',transcript:'文字起こし',gemini:'Geminiメモ'}[f.kind]||f.kind)+'／移動元：'+f.from+' → 移動先：'+f.to;$('results').append(file)})});$('message').textContent=state.dryRun?'移動予定を確認しました。Driveは変更していません。':'処理結果を確認してください。'}else $('message').textContent=result.message;await load()}catch(e){$('message').textContent=e.message}finally{disabled(false)}}$('register').onclick=()=>action('registerOrganizer');$('unregister').onclick=()=>action('unregisterOrganizer');$('preview').onclick=()=>action('runOrganizerNow');(async()=>{try{await load();$('message').textContent='アカウントを確認して操作してください。';disabled(false)}catch(e){$('message').textContent=e.message}})();
</script></body></html>
