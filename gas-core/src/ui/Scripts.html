<script>
'use strict';
const $=id=>document.getElementById(id), domains=['セールス・マーケ','EC','生産管理','経理・バックオフィス','Salesforce・AI','経営'];
let boot,current,offset=0,total=0,busy=false,page={rows:[],total:0,offset:0};
const parse=s=>{try{return JSON.parse(s||'[]')}catch(e){return []}};
const operationNames={confirm:'確定',edit_confirm:'修正して確定',hold:'保留',exclude:'対象外',retry:'再実行','取り込み':'取り込み'};
const fieldNames={status:'状態',scope_final:'社内／社外',placement_final:'格納先',domains_final:'事業部領域',related_project_ids_final:'関連するプロジェクト',minutes_title:'議事録名',confirmed_by:'確認者',confirmed_at:'確認日時',folder_id_final:'格納先フォルダ'};
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function message(text){$('message').textContent=text}
function rpc(name,arg){const start=Date.now();return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg)}).finally(()=>{$('elapsed').textContent='直近の通信時間：'+((Date.now()-start)/1000).toFixed(1)+'秒'})}
function localTime(value){const date=new Date(value);return value&&Number.isFinite(date.getTime())?date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false})+'（日本時間）':'未設定'}
function display(value,key){if(value===undefined||value===null||value==='')return '未設定';if(key==='confirmed_at')return localTime(value);if(['domains_final','related_project_ids_final','domains_auto','related_project_ids_auto'].includes(key)){const values=Array.isArray(value)?value:parse(value);return values.map(v=>{const project=boot.choices.projects.find(p=>p.id===v);return project?project.title:v}).join('／')||'未設定'}return String(value)}
function disable(value){busy=value;document.querySelectorAll('button').forEach(b=>{b.disabled=value});if(!value)actions()}
function actions(){document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=!current||busy||(b.dataset.action==='retry'?current.status!=='要対応':current.status==='要対応'||current.status.startsWith('対象外'))});$('prev').disabled=busy||offset===0;$('next').disabled=busy||offset+50>=total}
function choices(select,values,value){select.replaceChildren();values.forEach(v=>{const o=node('option',v);o.value=v;select.append(o)});select.value=value||''}
function checkbox(parent,value,label,checked){const l=node('label'),i=node('input');i.type='checkbox';i.value=value;i.checked=checked;l.append(i,document.createTextNode(label));parent.append(l)}
function renderList(data){page=data;total=data.total;offset=data.offset;$('rows').replaceChildren();data.rows.forEach(r=>{const tr=node('tr');tr.append(node('td',localTime(r.event_start)));const td=node('td'),b=node('button',r.display_id+' '+r.title);b.type='button';b.onclick=()=>loadDetail(r.meeting_key);td.append(b);tr.append(td);[r.source==='meet'?'Meet':'tl;dv',r.status,r.placement_final,display(r.domains_final,'domains_final'),r.taskCount,r.confidence].forEach(v=>tr.append(node('td',v)));$('rows').append(tr)});$('count').textContent=total+'件中 '+(data.rows.length?offset+1:0)+'〜'+(offset+data.rows.length)+'件';actions()}
async function refresh(){const filters={status:$('status').value,date:$('date').value,domain:$('domain').value,mine:$('mine').checked,offset};renderList(await rpc('reviewList',filters))}
function updateRow(row,key){let rows=page.rows.slice(),index=rows.findIndex(r=>r.meeting_key===key),count=page.total;const visible=row&&(!$('status').value||row.status===$('status').value)&&(!$('domain').value||parse(row.domains_final).includes($('domain').value));if(index>=0){if(visible)rows[index]=row;else{rows.splice(index,1);count=Math.max(0,count-1)}}renderList({rows,total:count,offset:page.offset})}
async function loadDetail(key){if(busy)return;disable(true);$('excludeConfirm').hidden=true;try{current=await rpc('reviewDetail',key);renderDetail();message('詳細を読み込みました。')}catch(e){current=null;$('detail').hidden=true;message(e.message)}finally{disable(false)}}
function bulletList(parent,title,values,format){parent.append(node('h4',title));if(!Array.isArray(values)||!values.length){parent.append(node('p','記載はありません。'));return}const ul=node('ul');values.forEach(value=>ul.append(node('li',format?format(value):String(value))));parent.append(ul)}
function summary(r){$('summary').replaceChildren();const s=r.summary||{};if(s.error)$('summary').append(node('p',s.error));bulletList($('summary'),'決定事項',s.decisions);bulletList($('summary'),'ネクストアクション',s.next_actions,a=>typeof a==='string'?a:[a.who,a.what,a.due?'期限：'+a.due:''].filter(Boolean).join('：'));$('summary').append(node('p','タスク提案：'+r.taskCount+'件（未反映）'))}
function history(rows){$('history').replaceChildren();if(!rows.length){$('history').append(node('p','変更履歴はありません。'));return}rows.forEach(h=>{const section=node('article');section.append(node('h4',localTime(h.at)+' '+(operationNames[h.action]||'更新')+'（'+h.result+'）'),node('p','操作者：'+h.actor));const before=parse(h.before)||{},after=parse(h.after)||{},ul=node('ul');Object.keys(fieldNames).forEach(key=>{if(key==='folder_id_final'&&before.placement_final!==after.placement_final)return;const a=display(before[key],key),b=display(after[key],key);if(a!==b)ul.append(node('li',fieldNames[key]+'：'+a+' → '+b))});if(!ul.children.length)ul.append(node('li','確認項目の変更はありません。'));section.append(ul);$('history').append(section)})}
function renderDetail(){const r=current;if(!r){$('detail').hidden=true;return}$('detail').hidden=false;$('excludeConfirm').hidden=true;$('detailTitle').textContent=r.display_id+' 詳細・編集';$('facts').replaceChildren();const files=r.fileStatus||{};[['会議キー',r.meeting_key],['日時',localTime(r.event_start)+' 〜 '+localTime(r.event_end)],['会議名',r.title],['主催者',r.organizer_email],['参加者',r.attendees.map(a=>a.email+'（'+(a.internal?'社内':'社外')+'）').join('／')],['状態',r.status],['根拠・確信度',r.reason+'／'+r.confidence],['ファイル状態','録画：'+(files.recording||'なし')+' ／ 文字起こし：'+(files.transcript||'なし')+' ／ Geminiメモ：'+(files.gemini||'なし')],['Notionの反映状態',r.notion_status],['エラー',r.last_error]].forEach(([k,v])=>$('facts').append(node('p',k+'：'+(v||'未設定'))));$('links').replaceChildren();r.links.forEach(l=>{if(!/^https:\/\/(drive.google.com|www.notion.so)\//.test(l.url))return;const a=node('a',l.title);a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';$('links').append(a)});summary(r);$('comparison').replaceChildren();[['区分','scope_auto','scope_final'],['格納先','placement_auto','placement_final'],['事業部領域','domains_auto','domains_final'],['関連プロジェクト','related_project_ids_auto','related_project_ids_final']].forEach(([label,a,b])=>{const p=node('p',label+'：自動 '+display(r[a],a)+' → 現在 '+display(r[b],b));if(r[a]!==r[b])p.className='changed';$('comparison').append(p)});$('pending').textContent=r.pending?'処理状況：'+(r.pending.state==='done'?'完了':r.pending.state==='failed'?'要対応':'処理中')+' ／ フォルダ：'+(r.pending.drive?'完了':'未完了')+' ／ Notion：'+(r.pending.notion?'完了':'未完了')+' ／ Chatwork：'+(r.pending.chatwork?'完了（予定記録を含む）':'未完了'):'';$('scope').value=r.scope_final||'社内';choices($('placement'),boot.choices.folders,r.placement_final);$('placementSearch').value='';$('projectSearch').value='';$('domains').replaceChildren();domains.forEach(d=>checkbox($('domains'),d,d,parse(r.domains_final).includes(d)));$('projects').replaceChildren();const known=new Set();boot.choices.projects.forEach(p=>{known.add(p.id);checkbox($('projects'),p.id,p.title,parse(r.related_project_ids_final).includes(p.id))});parse(r.related_project_ids_final).filter(id=>!known.has(id)).forEach(id=>checkbox($('projects'),id,'現在の関連先（保存時に所属を確認） '+id,true));$('minutesTitle').value=r.minutes_title;$('newClient').hidden=!boot.admin;$('clientName').value='';$('clientDomains').value='';$('ackExternal').checked=false;history(r.history);actions()}
async function submit(action,confirmed){if(busy||!current)return;if(action==='exclude'&&!confirmed){$('excludeConfirm').hidden=false;return}const key=current.meeting_key,request={meetingKey:key,version:current.version,nonce:boot.nonce,action};if(action==='edit_confirm')request.edits={scope:$('scope').value,placement:$('placement').value,domains:[...$('domains').querySelectorAll('input:checked')].map(i=>i.value),projectIds:[...$('projects').querySelectorAll('input:checked')].map(i=>i.value),minutesTitle:$('minutesTitle').value,newClient:{name:$('clientName').value,domains:$('clientDomains').value},ackExternal:$('ackExternal').checked};disable(true);$('excludeConfirm').hidden=true;try{const result=await rpc('reviewSubmit',request);message(result.message);if(typeof result.dryRun==='boolean'){boot.dryRun=result.dryRun;$('mode').textContent=boot.dryRun?'予定確認モード（DRY_RUN=true）':'テスト反映モード（DRY_RUN=false）'}current=Object.prototype.hasOwnProperty.call(result,'row')?result.row:await rpc('reviewDetail',key);updateRow(current,key);renderDetail()}catch(e){const reason=e.message||String(e);if(reason.includes('先に更新されました')){current=null;$('detail').hidden=true;try{current=await rpc('reviewDetail',key);updateRow(current,key);renderDetail();message(reason+' 最新の詳細を読み直しました。内容を確認してから操作してください。')}catch(reload){message(reason+' 最新情報を取得できません。'+reload.message)}}else message(reason)}finally{disable(false)}}
$('filters').onsubmit=async e=>{e.preventDefault();offset=0;disable(true);try{await refresh()}catch(e){message(e.message)}finally{disable(false)}};
$('prev').onclick=async()=>{offset=Math.max(0,offset-50);disable(true);try{await refresh()}catch(e){message(e.message)}finally{disable(false)}};$('next').onclick=async()=>{offset+=50;disable(true);try{await refresh()}catch(e){message(e.message)}finally{disable(false)}};
$('reloadList').onclick=async()=>{disable(true);try{await refresh();message('一覧を更新しました。')}catch(e){message(e.message)}finally{disable(false)}};
$('excludeCancel').onclick=()=>{$('excludeConfirm').hidden=true};$('excludeApprove').onclick=()=>submit('exclude',true);
$('placementSearch').oninput=()=>{[...$('placement').options].forEach(o=>o.hidden=!o.textContent.includes($('placementSearch').value))};$('projectSearch').oninput=()=>{[...$('projects').children].forEach(l=>l.hidden=!l.textContent.includes($('projectSearch').value))};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>submit(b.dataset.action));
(async()=>{disable(true);try{boot=await rpc('reviewBootstrap');$('identity').textContent='利用者：'+boot.actor;$('mode').textContent=boot.dryRun?'予定確認モード（DRY_RUN=true）':'テスト反映モード（DRY_RUN=false）';domains.forEach(d=>{const o=node('option',d);o.value=d;$('domain').append(o)});renderList(boot.list);message('一覧から議事録を選んでください。')}catch(e){message(e.message)}finally{disable(false)}})();
</script>
